name: Agamon Health
description: >-
  Agamon Health is a healthcare AI company that improves imaging patient
  workflow management through automation across the continuum of care. Its
  Coordinate platform uses proprietary deep-learning natural language
  processing (NLP) models, trained on tens of millions of radiology reports,
  to automatically extract actionable findings from signed radiology reports,
  determine whether follow-up is needed, and capture modality, body part, and
  timeframe so radiology teams can automate patient communications, personalize
  outreach, and track follow-up adherence. Founded in 2018 and headquartered in
  New York City, Agamon has helped radiology teams increase productivity by up
  to 30 percent. The company was surfaced as a Seedcamp portfolio company and
  added to the API Evangelist network; it does not currently publish a public
  developer API, so this profile captures company identity and domain security
  rather than API artifacts.
